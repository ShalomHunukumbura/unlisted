<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Unlisted</title>
<style>
  :root { --canvas: #fbfbfa; --ink: #2f3437; --ink-strong: #111; --muted: #787774; --line: #eaeaea; }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #191918; --ink: #d4d3d0; --ink-strong: #f1f0ed; --muted: #9b9a97; --line: #2f2f2d; }
  }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 32rem; padding: 4rem 1rem; margin: 0 auto; }
  h1 { font: 400 2.25rem/1.1 Georgia, serif; color: var(--ink-strong); margin: 0 0 1rem; }
  button { margin-top: 1.5rem; padding: .6rem 1.2rem; border: 0; border-radius: 6px; background: var(--ink-strong); color: var(--canvas); font: inherit; font-size: .9rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Unlisted shows live listings, so it needs a connection. Check your signal and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
