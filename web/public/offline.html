<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Unlisted</title>
<style>
  :root { --canvas: #f7f8fa; --ink: #3b4453; --ink-strong: #0d1421; --muted: #667085; --line: #e3e6eb; --accent: #0b7a68; --accent-fg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #0a0e14; --ink: #bac3d0; --ink-strong: #eef2f7; --muted: #8892a3; --line: #222a36; --accent: #34c3a6; --accent-fg: #04201b; }
  }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 32rem; padding: 4rem 1rem; margin: 0 auto; }
  h1 { font: 600 2rem/1.15 system-ui, sans-serif; letter-spacing: -0.03em; color: var(--ink-strong); margin: 0 0 1rem; }
  button { margin-top: 1.5rem; padding: .6rem 1.2rem; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font: inherit; font-size: .9rem; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Unlisted shows live listings, so it needs a connection. Check your signal and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
