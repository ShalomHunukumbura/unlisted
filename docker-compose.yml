services:
  postgres:
    # postgres:16-alpine plus pgvector, see db/docker/Dockerfile.
    build: db/docker
    image: jobsite-postgres
    environment:
      POSTGRES_USER: jobsite
      POSTGRES_PASSWORD: jobsite
      POSTGRES_DB: jobsite
    ports:
      # 5433 on the host: the machine already runs a local postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsite"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
