name: Sync jobs

# Keeps the public database fresh: every hour, check the boards that are due
# (those with open jobs every run, quiet ones every ~6 hours), store the past
# past week of jobs, and prune the rest. Writes to the database in the
# DATABASE_URL secret (Neon), with raw payloads off so it fits the free tier.
# The sync downloads everything first and writes in one short burst, so the
# database is awake for minutes per run, which keeps Neon's free compute safe.
on:
  schedule:
    # Hourly at :23, off the busy :00 (GitHub may start it a little late). If
    # scheduled runs ever stop appearing (e.g. after a repo rename), changing
    # this line makes GitHub register the schedule again.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      backfill_pay:
        description: "Also read pay ranges out of jobs stored before pay parsing existed (one-off)"
        type: boolean
        default: false
  # Also when this file changes, so an edit is tested right away (and so GitHub
  # registers the workflow: one with only schedule/dispatch wasn't picked up).
  push:
    branches: [master]
    paths: [.github/workflows/sync.yml]

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORE_RAW: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e workers
      - name: Apply migrations
        run: MIGRATE_URL="$DATABASE_URL" ./db/migrate.sh
      - name: Backfill pay ranges
        if: inputs.backfill_pay
        run: jobsite backfill-pay
        working-directory: workers
      - name: Sync the boards that are due
        run: jobsite sync --due --workers 6
        working-directory: workers
      # The site sends them (the filters live in the web code); this just says
      # the new jobs are in. Skipped until the ALERTS_SECRET secret exists.
      - name: Email alerts
        if: ${{ !cancelled() }}
        env:
          ALERTS_SECRET: ${{ secrets.ALERTS_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://unlisted-tau.vercel.app' }}
        run: |
          if [ -z "$ALERTS_SECRET" ]; then echo "ALERTS_SECRET not set, skipping"; exit 0; fi
          curl -fsS --max-time 90 -X POST -H "Authorization: Bearer $ALERTS_SECRET" \
            "$SITE_URL/api/alerts/send" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        run: jobsite stats | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: workers
