name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  workers:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsite
          POSTGRES_PASSWORD: jobsite
          POSTGRES_DB: jobsite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobsite" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://jobsite:jobsite@localhost:5432/jobsite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e workers pytest
      - run: MIGRATE_URL="$DATABASE_URL" ./db/migrate.sh
      - run: python -m pytest tests/ -q
        working-directory: workers

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # PageProps/LayoutProps are generated types; a fresh checkout has none yet
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
