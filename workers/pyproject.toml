[project]
name = "jobsite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "tenacity>=8.2",
    "psycopg[binary,pool]>=3.1",
    "typer>=0.12",
    "nh3>=0.2",
    "selectolax>=0.3",
    "apscheduler>=3.10",
    "pydantic-settings>=2.2",
]

[project.scripts]
jobsite = "jobsite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
